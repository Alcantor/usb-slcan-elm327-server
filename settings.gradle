pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "USB CAN to ELM327 Server"
include ':app'

/* The androidCAN library is its own repository, pulled in as a submodule. The
 * extra level is because that repository holds the library module beside its
 * own test app. Clone with --recurse-submodules, or this path will not exist. */
include ':androidCAN'
project(':androidCAN').projectDir = new File(settingsDir, 'androidCAN/androidCAN')
