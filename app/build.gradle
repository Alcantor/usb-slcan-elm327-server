plugins {
    alias(libs.plugins.android.application)
}

def appVersionCode = 9
/* Also names the APK, so a branch that ships a variant only sets this. */
def appVersionName = "2.0"

/*
 * Release signing, from a keystore.properties that is never committed:
 *
 *   storeFile=/path/to/upload-keystore.jks
 *   storePassword=...
 *   keyAlias=...
 *   keyPassword=...
 *
 * Without that file the release build is simply left unsigned, so a fresh
 * clone still builds - it just cannot produce something installable.
 */
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasKeystore = keystoreProps['storeFile'] != null

android {
    compileSdk = 35

    defaultConfig {
        applicationId = "com.clusterrr.slcan2elm327"
        minSdk = 26
        targetSdk = 33
        versionCode = appVersionCode
        versionName = appVersionName
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile = file(keystoreProps['storeFile'])
                storePassword = keystoreProps['storePassword']
                keyAlias = keystoreProps['keyAlias']
                keyPassword = keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasKeystore) signingConfig = signingConfigs.release
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    namespace = 'com.clusterrr.slcan2elm327'
}

/* Name each APK after the version, so a release asset has a stable name worth
 * linking to. Replaces the obsolete applicationVariants API, removed from
 * AGP 9's variant model. */
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set("can2elm327-v${appVersionName}-${variant.buildType}.apk")
        }
    }
}

dependencies {
    implementation project(':androidCAN')
    implementation libs.appcompat
    implementation libs.material
}
